<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal</title>
</head>
<body style="background-color: #0f172a; color: white; text-align: center; font-family: Arial, sans-serif; padding-top: 60px;">

    <div style="padding: 0 20px;">
        <h1 style="font-size: 24px; margin-bottom: 30px;">Авторизация сессии</h1>
        
        <button id="btn" style="width: 100%; max-width: 320px; padding: 16px; font-size: 18px; background-color: #2563eb; color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: bold;">
            Подключить кошелек
        </button>
        
        <div id="status" style="margin-top: 25px; color: #94a3b8; font-size: 15px; word-break: break-all;"></div>
    </div>

    <script>
        document.getElementById('btn').addEventListener('click', function() {
            const statusBox = document.getElementById('status');
            statusBox.innerText = "Обработка запроса...";

            try {
                // Прямой вызов моста через схему
                const projectId = "7576b7b5b1f1ce840bb5bc8db8acaa41";
                const uri = `wc:test@2?symKey=abcdef0123456789&relay-protocol=irn&projectId=${projectId}`;
                
                statusBox.innerText = "Запуск приложения...";
                
                // Переход по ссылке доверенного кошелька
                window.location.href = `https://link.trustwallet.com/wc?uri=${encodeURIComponent(uri)}`;
            } catch (err) {
                statusBox.innerText = "Ошибка: " + err.message;
            }
        });
    </script>
</body>
</html>
