<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WalletConnect Portal</title>
</head>
<body style="background-color: #0f172a; color: white; text-align: center; font-family: Arial, sans-serif; padding-top: 50px;">

    <div id="mainScreen">
        <h1>Подключение кошелька</h1>
        
        <button id="wcConnectBtn" style="padding: 14px 28px; font-size: 16px; background-color: #3b82f6; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold;">
            Connect Wallet
        </button>
        
        <p id="walletAddress" style="margin-top: 20px; color: #94a3b8; font-size: 14px; word-break: break-all; padding: 0 20px;"></p>
    </div>

    <script>
        document.getElementById('wcConnectBtn').addEventListener('click', async function() {
            const infoElem = document.getElementById('walletAddress');
            infoElem.innerText = "Попытка подключения...";
            
            try {
                // Проверяем наличие провайдера в кошельке
                const provider = window.ethereum || window.trustwallet;
                
                if (!provider) {
                    infoElem.innerText = "Ошибка: Провайдер кошелька не обнаружен в WebView.";
                    return;
                }

                infoElem.innerText = "Запрос аккаунтов...";
                const accounts = await provider.request({ method: 'eth_requestAccounts' });
                
                if (accounts && accounts.length > 0) {
                    infoElem.innerText = "Успешно подключено: " + accounts[0];
                    alert("Кошелек подключен!");
                } else {
                    infoElem.innerText = "Ошибка: Кошелек не вернул аккаунты.";
                }
            } catch (error) {
                console.error(error);
                infoElem.innerText = "Ошибка: " + (error.message || JSON.stringify(error));
            }
        });
    </script>
</body>
</html>
