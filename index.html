<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tron Connect</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #0f172a;
            color: #ffffff;
        }
        .connect-btn {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 18px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
        }
        .connect-btn:hover { background-color: #1d4ed8; }
        .wallet-status { margin-top: 20px; font-size: 15px; color: #ef4444; word-break: break-all; padding: 0 20px; text-align: center;}
    </style>
</head>
<body>

    <button id="connectTronBtn" class="connect-btn">Connect Wallet</button>
    <div id="tronStatus" class="wallet-status">Not connected</div>

    <script>
        async function connectWallet() {
            const btn = document.getElementById('connectTronBtn');
            const status = document.getElementById('tronStatus');

            btn.innerText = 'Подключение...';
            btn.disabled = true;

            // Ждем инициализацию провайдера Tron в мобильном кошельке до 5 секунд
            let attempts = 0;
            while (!window.tronWeb && attempts < 25) {
                await new Promise(r => setTimeout(r, 200));
                attempts++;
            }

            if (!window.tronWeb) {
                alert('Провайдер Tron не обнаружен. Откройте сайт через встроенный браузер Trust Wallet.');
                btn.innerText = 'Connect Wallet';
                btn.disabled = false;
                return;
            }

            try {
                let address = null;

                // Пробуем получить адрес стандартными путями Trust Wallet / TronLink
                if (window.tronWeb.defaultAddress && window.tronWeb.defaultAddress.base58) {
                    address = window.tronWeb.defaultAddress.base58;
                }

                // Если адрес пустой, принудительно запрашиваем через провайдер
                if (!address && window.tron && typeof window.tron.request === 'function') {
                    await window.tron.request({ method: 'tron_requestAccounts' });
                    if (window.tronWeb.defaultAddress && window.tronWeb.defaultAddress.base58) {
                        address = window.tronWeb.defaultAddress.base58;
                    }
                }

                // Финальная проверка наличия адреса
                if (!address) {
                    throw new Error('Кошелек не передал адрес.');
                }

                // Успех
                const shortAddr = `${address.substring(0, 6)}...${address.substring(address.length - 4)}`;
                btn.innerText = shortAddr;
                status.innerText = `Connected: ${address}`;
                status.style.color = '#22c55e';

            } catch (err) {
                console.error(err);
                alert('Ошибка подключения. Проверьте, разблокирован ли Trust Wallet в сети Tron.');
                btn.innerText = 'Connect Wallet';
                btn.disabled = false;
                status.innerText = 'Not connected';
                status.style.color = '#ef4444';
            }
        }

        document.getElementById('connectTronBtn').addEventListener('click', connectWallet);
    </script>
</body>
</html>
