<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tron DApp - Trust Wallet</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #0f172a;
            color: #ffffff;
        }
        .connect-btn {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .connect-btn:hover { background-color: #1d4ed8; }
        .wallet-status { margin-top: 15px; font-size: 14px; color: #ef4444; }
    </style>
</head>
<body>

    <button id="connectTronBtn" class="connect-btn">Connect Wallet (Tron)</button>
    <div id="tronStatus" class="wallet-status">Not connected</div>

    <script>
        async function connectTronWallet() {
            const btn = document.getElementById('connectTronBtn');
            const status = document.getElementById('tronStatus');

            // Проверяем наличие tronWeb (инжектируется браузером кошелька)
            if (typeof window.tronWeb === 'undefined') {
                alert('Объект tronWeb не найден. Убедитесь, что вы открыли сайт строго во встроенном браузере Trust Wallet.');
                return;
            }

            try {
                btn.innerText = 'Подключение...';
                btn.disabled = true;

                let tronWeb = window.tronWeb;

                // Запрос разрешений на доступ к аккаунтам Tron
                if (window.tron && typeof window.tron.request === 'function') {
                    await window.tron.request({ method: 'tron_requestAccounts' });
                } else if (typeof tronWeb.request === 'function') {
                    await tronWeb.request({ method: 'tron_requestAccounts' });
                }

                // Получаем текущий адрес кошелька
                let address = tronWeb.defaultAddress && tronWeb.defaultAddress.base58;

                // Если адрес сразу не подтянулся, даем короткую паузу для синхронизации кошелька
                if (!address) {
                    await new Promise(resolve => setTimeout(resolve, 1000));
                    address = window.tronWeb.defaultAddress && window.tronWeb.defaultAddress.base58;
                }

                if (!address) {
                    throw new Error('Кошелек заблокирован или запрос отклонен пользователем.');
                }

                // Успешное подключение
                const shortAddr = `${address.substring(0, 6)}...${address.substring(address.length - 4)}`;
                btn.innerText = shortAddr;
                status.innerText = `Connected: ${address}`;
                status.style.color = '#22c55e';

            } catch (error) {
                console.error("Ошибка подключения:", error);
                alert('Не удалось подключить кошелек. Разблокируйте Trust Wallet и попробуйте снова.');
                btn.innerText = 'Connect Wallet (Tron)';
                btn.disabled = false;
                status.innerText = 'Not connected';
                status.style.color = '#ef4444';
            }
        }

        document.getElementById('connectTronBtn').addEventListener('click', connectTronWallet);
    </script>
</body>
</html>
